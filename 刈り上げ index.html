<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>校舎ナビ</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

<style>

/* =========================
   全体
========================= */

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;
background:#f3eadf;
color:#5b4636;
min-height:100vh;
}


/* =========================
   メイン
========================= */

.page{
width:100%;
max-width:900px;
margin:0 auto;
padding:60px 20px;
}


/* =========================
   ナビゲーションカード
========================= */

.container{
background:#fffaf3;
padding:40px;
border-radius:20px;
box-shadow:0 12px 35px rgba(91,70,54,0.12);
text-align:center;
max-width:460px;
margin:0 auto;
}


/* =========================
   タイトル
========================= */

.title{
font-family:'Caveat',cursive;
font-size:42px;
font-weight:400;
letter-spacing:1px;
margin:0 0 32px;
color:#80624d;
}


/* =========================
   入力
========================= */

.input-group{
margin-bottom:22px;
text-align:left;
}

label{
display:block;
font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;
font-size:15px;
color:#705541;
margin-bottom:7px;
}

input{
display:block;
width:100%;
padding:13px 15px;
border:1px solid #dfcdbb;
border-radius:10px;
font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;
font-size:16px;
background:#fff;
color:#5b4636;
outline:none;
transition:0.2s;
}

input::placeholder{
color:#b8a99a;
}

input:focus{
border-color:#c9a98d;
box-shadow:0 0 0 3px rgba(201,169,141,0.15);
}


/* =========================
   ボタン
========================= */

button{
display:block;
width:100%;
padding:14px;
border:none;
border-radius:11px;

background:#d9b89c;
color:#fffaf3;

font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;
font-size:16px;

cursor:pointer;
transition:0.2s;
}

button:hover{
background:#cda688;
transform:translateY(-1px);
}

button:active{
transform:translateY(0);
}


/* =========================
   結果
========================= */

#result{
margin-top:25px;
padding:16px;

border-radius:12px;
background:#f8f0e7;
border:1px solid #eadbca;

line-height:1.8;
font-size:16px;
color:#624c3a;

min-height:24px;
}


/* =========================
   校舎案内図
========================= */

.map-section{
margin-top:55px;
text-align:center;
}


/* 案内図タイトル */

.map-title{
font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;
font-size:22px;
font-weight:normal;
letter-spacing:2px;
color:#705541;

margin:0 0 18px;
}


/* 案内図の説明 */

.map-description{
font-size:13px;
color:#9a8775;
margin:0 0 20px;
}


/* 案内図 */

.school-map{
display:block;
width:100%;
height:auto;

background:#fffaf3;
padding:12px;

border-radius:16px;
box-shadow:0 8px 25px rgba(91,70,54,0.10);
}


/* =========================
   フッター
========================= */

.footer{
margin-top:35px;
text-align:center;
font-size:12px;
color:#a18e7d;
}


/* =========================
   スマートフォン
========================= */

@media(max-width:600px){

.page{
padding:35px 15px;
}

.container{
padding:30px 22px;
}

.title{
font-size:38px;
}

.map-section{
margin-top:40px;
}

.map-title{
font-size:19px;
}

.school-map{
padding:7px;
border-radius:12px;
}

}

</style>

</head>


<body>

<div class="page">

<!-- =====================
     校舎ナビ
===================== -->

<div class="container">

<h1 class="title">𓆛saka-navi𓆝</h1>


<div class="input-group">

<label for="start">
現在の部屋
</label>

<input
id="start"
type="text"
placeholder="0401"
autocomplete="off"
>

</div>


<div class="input-group">

<label for="end">
目的の部屋
</label>

<input
id="end"
type="text"
placeholder="0203"
autocomplete="off"
>

</div>


<button
id="routeButton"
onclick="findRoute()"
disabled
>
読み込み中...
</button>


<div id="result"></div>

</div>


<!-- =====================
     校舎案内図
===================== -->

<section class="map-section">

<h2 class="map-title">
校舎案内図
</h2>

<p class="map-description">
校舎の部屋と階段の位置を確認できます
</p>

<img
src="map.png"
alt="校舎案内図"
class="school-map"
>

</section>


<div class="footer">
saka-navi
</div>

</div>


<script>

/* =========================
   Pyodide
========================= */

let pyodide;


/* Pyodideを読み込む */

async function init(){

try{

pyodide = await loadPyodide();


/* ボタンを使用可能にする */

const button = document.getElementById("routeButton");

button.disabled = false;
button.textContent = "案内開始";

}catch(error){

console.error(error);

document.getElementById("routeButton").textContent =
"読み込みに失敗しました";

}

}


/* 起動 */

init();


/* =========================
   ルート検索
========================= */

async function findRoute(){

/* Pyodideの読み込み確認 */

if(!pyodide){

document.getElementById("result").textContent =
"しばらくお待ちください。";

return;

}


/* 入力値 */

let start =
document.getElementById("start").value.trim();

let end =
document.getElementById("end").value.trim();


/* 未入力チェック */

if(!start || !end){

document.getElementById("result").textContent =
"現在の部屋と目的の部屋を入力してください。";

return;

}


/* Pythonコード */

let code = `
graph = {

"0401":["0402","階段1"],
"0402":["0401","0403"],
"0403":["0402","0404"],
"0404":["0403","0405"],
"0405":["0404","0406"],
"0406":["0405","0407"],
"0407":["0406","階段2"],

"0301":["0302","階段3"],
"0302":["0301","0303"],
"0303":["0302","0304"],
"0304":["0303","0305"],
"0305":["0304","0306"],
"0306":["0305","0307"],
"0307":["0306","階段4"],

"0201":["0202","階段5"],
"0202":["0201","0203"],
"0203":["0202","0204"],
"0204":["0203","0205"],
"0205":["0204","0206"],
"0206":["0205","0207"],
"0207":["0206","0208"],
"0208":["0207","階段6"],

"0101":["0102","階段7"],
"0102":["0101","0103"],
"0103":["0102","0104"],
"0104":["0103","0105"],
"0105":["0104","0106"],
"0106":["0105","昇降口"],

"階段1":["0401","階段3"],
"階段2":["0407","階段4"],
"階段3":["階段1","0301","階段5"],
"階段4":["階段2","0307","階段6"],
"階段5":["階段3","0201","階段7"],
"階段6":["階段4","0208","階段8"],
"階段7":["階段5","0101"],
"階段8":["階段6","玄関"],

"玄関":["階段8"],
"昇降口":["0106"]

}


from collections import deque


def find_route(start,end):

    if start not in graph:
        return ["現在の部屋が見つかりません"]

    if end not in graph:
        return ["目的の部屋が見つかりません"]

    queue = deque([[start]])

    visited = set()


    while queue:

        path = queue.popleft()

        node = path[-1]


        if node == end:
            return path


        if node not in visited:

            visited.add(node)


            for nxt in graph.get(node,[]):

                if nxt not in visited:

                    new_path = list(path)

                    new_path.append(nxt)

                    queue.append(new_path)


    return ["ルートなし"]


result = find_route("${start}","${end}")

" ↓ ".join(result)
`;


/* Python実行 */

try{

let result =
await pyodide.runPythonAsync(code);


/* 結果表示 */

document.getElementById("result").textContent =
result;

}catch(error){

console.error(error);

document.getElementById("result").textContent =
"ルート検索中にエラーが発生しました。";

}

}

</script>

</body>

</html>
